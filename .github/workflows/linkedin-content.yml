name: LinkedIn content drafts

on:
  schedule:
    # Every 2 days at 07:17 UTC (08:17 in Lagos). Scheduled runs only fire on the default branch.
    - cron: "17 7 */2 * *"
  workflow_dispatch: # lets you run it any time from the Actions tab

permissions:
  contents: read

jobs:
  drafts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r linkedin-bot/requirements.txt
      - name: Generate drafts and send to Telegram
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python linkedin-bot/generate.py
      - name: Keep a copy of the PDF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linkedin-drafts
          path: linkedin-bot/*.pdf
          if-no-files-found: ignore
          retention-days: 30
