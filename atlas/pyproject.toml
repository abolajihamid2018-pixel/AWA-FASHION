[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas"
version = "0.1.0"
description = "ATLAS 2.0 research platform: Phase 1 read-only account analytics"
requires-python = ">=3.10"
# Core is deliberately small. Everything here has Windows 64-bit wheels.
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pydantic>=2.5",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.30"]
mt5 = ["MetaTrader5>=5.0.45"]      # Windows only; not needed for mock mode
dev = ["pytest>=7.4"]

[project.scripts]
atlas = "atlas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
atlas = ["db/schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
